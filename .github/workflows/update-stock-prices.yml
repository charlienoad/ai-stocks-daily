name: Update AI Stock Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Update all stock prices
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: app4h1p2LThxhoWsu
        run: |
          node <<'NODE'
          const apiKey = process.env.ALPHA_VANTAGE_API_KEY;
          const airtableToken = process.env.AIRTABLE_TOKEN;
          const baseId = process.env.AIRTABLE_BASE_ID;
          const tableName = "Stock Tracker";

          async function getAllRecords() {
            let records = [];
            let offset = null;

            do {
              let url =
                `https://api.airtable.com/v0/${baseId}/${encodeURIComponent(tableName)}`;

              if (offset) {
                url += `?offset=${encodeURIComponent(offset)}`;
              }

              const response = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${airtableToken}`
                }
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                  `Airtable lookup failed: ${response.status} ${errorText}`
                );
              }

              const data = await response.json();

              records = records.concat(data.records || []);
              offset = data.offset || null;

            } while (offset);

            return records;
          }

          async function getPrice(ticker) {
            const priceUrl =
              `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(ticker)}&apikey=${apiKey}`;

            const response = await fetch(priceUrl);

            if (!response.ok) {
              throw new Error(
                `Alpha Vantage HTTP error for ${ticker}: ${response.status}`
              );
            }

            const data = await response.json();
            const quote = data["Global Quote"];

            if (!quote || !quote["05. price"]) {
              console.log(`No price returned for ${ticker}:`);
              console.log(JSON.stringify(data, null, 2));
              return null;
            }

            const price = Number(quote["05. price"]);

            if (!Number.isFinite(price)) {
              throw new Error(`Invalid price returned for ${ticker}.`);
            }

            return price;
          }

          async function updateRecord(record, currentPrice) {
            const updateUrl =
              `https://api.airtable.com/v0/${baseId}/${encodeURIComponent(tableName)}/${record.id}`;

            const fields = {
              "Current Price (USD)": currentPrice,
              "Last Updated": new Date().toISOString()
            };

            const existingDateAddedPrice =
              record.fields["Date Added Price (USD)"];

            if (
              existingDateAddedPrice === undefined ||
              existingDateAddedPrice === null ||
              existingDateAddedPrice === ""
            ) {
              fields["Date Added Price (USD)"] = currentPrice;
            }

            const response = await fetch(updateUrl, {
              method: "PATCH",
              headers: {
                Authorization: `Bearer ${airtableToken}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ fields })
            });

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(
                `Airtable update failed for ${record.fields.Ticker}: ${response.status} ${errorText}`
              );
            }
          }

          async function main() {
            const records = await getAllRecords();

            console.log(`Found ${records.length} stock(s) in Airtable.`);

            for (const record of records) {
              const ticker = record.fields.Ticker;

              if (!ticker) {
                console.log(`Skipping record ${record.id}: no ticker.`);
                continue;
              }

              console.log(`Updating ${ticker}...`);

              try {
                const currentPrice = await getPrice(ticker);

                if (currentPrice === null) {
                  console.log(`Skipping ${ticker}: no price available.`);
                  continue;
                }

                console.log(`${ticker} current price: $${currentPrice}`);

                await updateRecord(record, currentPrice);

                console.log(`${ticker} updated successfully.`);

              } catch (error) {
                console.error(`Error updating ${ticker}:`, error.message);
              }

              // Small pause between API requests
              await new Promise(resolve => setTimeout(resolve, 1500));
            }

            console.log("Finished updating all stocks.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
