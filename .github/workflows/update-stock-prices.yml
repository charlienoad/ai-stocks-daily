name: Update AI Stock Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Update all stock prices
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: app4h1p2LThxhoWsu
        run: |
          node <<'NODE'
          const apiKey = process.env.ALPHA_VANTAGE_API_KEY;
          const airtableToken = process.env.AIRTABLE_TOKEN;
          const baseId = process.env.AIRTABLE_BASE_ID;
          const tableName = "Stock Tracker";

          async function getAllRecords() {
            let records = [];
            let offset = null;

            do {
              let url =
                `https://api.airtable.com/v0/${baseId}/${encodeURIComponent(tableName)}`;

              if (offset) {
                url += `?offset=${encodeURIComponent(offset)}`;
              }

              const response = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${airtableToken}`
                }
              });

              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(
                  `Airtable lookup failed: ${response.status} ${errorText}`
                );
              }

              const data = await response.json();

              records = records.concat(data.records || []);
              offset = data.offset || null;

            } while (offset);

            return records;
          }

          async function searchSymbol(keyword, market) {
            const url =
              `https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords=${encodeURIComponent(keyword)}&apikey=${apiKey}`;

            const response = await fetch(url);

            if (!response.ok) {
              throw new Error(
                `Alpha Vantage symbol search failed: ${response.status}`
              );
            }

            const data = await response.json();

            if (!data.bestMatches || data.bestMatches.length === 0) {
              return null;
            }

            const matches = data.bestMatches;

            // Try to find the correct exchange based on the Airtable Market field.
            const marketMap = {
              "NASDAQ": ["NASDAQ"],
              "NYSE": ["NYSE"],
              "LSE": ["LONDON STOCK EXCHANGE", "LSE"],
              "Tokyo Stock Exchange": ["TOKYO"],
              "Korea Exchange": ["KOREA"],
              "SIX Swiss Exchange": ["SWISS"],
              "HKEX": ["HONG KONG"]
            };

            const wantedMarkets = marketMap[market] || [];

            for (const match of matches) {
              const exchange =
                String(match["4. region"] || "").toUpperCase();

              const matched = wantedMarkets.some(
                wanted => exchange.includes(wanted)
              );

              if (matched) {
                return match["1. symbol"];
              }
            }

            // If no exchange match is found, use the first best match.
            return matches[0]["1. symbol"];
          }

          async function getPrice(symbol) {
            const priceUrl =
              `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(symbol)}&apikey=${apiKey}`;

            const response = await fetch(priceUrl);

            if (!response.ok) {
              throw new Error(
                `Alpha Vantage price request failed: ${response.status}`
              );
            }

            const data = await response.json();
            const quote = data["Global Quote"];

            if (!quote || !quote["05. price"]) {
              return null;
            }

            const price = Number(quote["05. price"]);

            if (!Number.isFinite(price)) {
              return null;
            }

            return price;
          }

          async function updateRecord(record, currentPrice) {
            const updateUrl =
              `https://api.airtable.com/v0/${baseId}/${encodeURIComponent(tableName)}/${record.id}`;

            const fields = {
              "Current Price (USD)": currentPrice,
              "Last Updated": new Date().toISOString()
            };

            const existingDateAddedPrice =
              record.fields["Date Added Price (USD)"];

            if (
              existingDateAddedPrice === undefined ||
              existingDateAddedPrice === null ||
              existingDateAddedPrice === ""
            ) {
              fields["Date Added Price (USD)"] = currentPrice;
            }

            const response = await fetch(updateUrl, {
              method: "PATCH",
              headers: {
                Authorization: `Bearer ${airtableToken}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ fields })
            });

            if (!response.ok) {
              const errorText = await response.text();

              throw new Error(
                `Airtable update failed: ${response.status} ${errorText}`
              );
            }
          }

          async function main() {
            const records = await getAllRecords();

            console.log(`Found ${records.length} stock(s) in Airtable.`);

            for (const record of records) {
              const ticker = record.fields.Ticker;
              const market = record.fields.Market;
              const company = record.fields.Company;

              if (!ticker) {
                console.log(`Skipping ${company || record.id}: no ticker.`);
                continue;
              }

              console.log(
                `Processing ${company || ticker} (${ticker}) - ${market}`
              );

              try {
                let alphaSymbol = ticker;

                // If the ticker already contains an exchange suffix,
                // use it directly.
                if (!ticker.includes(".")) {

                  // US markets generally work with the plain ticker.
                  if (
                    market !== "NASDAQ" &&
                    market !== "NYSE"
                  ) {
                    const searchedSymbol =
                      await searchSymbol(
                        ticker,
                        market
                      );

                    if (searchedSymbol) {
                      alphaSymbol = searchedSymbol;
                    }
                  }
                }

                console.log(
                  `Alpha Vantage symbol: ${alphaSymbol}`
                );

                const currentPrice =
                  await getPrice(alphaSymbol);

                if (currentPrice === null) {
                  console.log(
                    `No price returned for ${company || ticker}.`
                  );
                  continue;
                }

                console.log(
                  `${ticker} current price: $${currentPrice}`
                );

                await updateRecord(
                  record,
                  currentPrice
                );

                console.log(
                  `${ticker} updated successfully.`
                );

              } catch (error) {
                console.error(
                  `Error updating ${ticker}:`,
                  error.message
                );
              }

              // Small pause between requests.
              await new Promise(
                resolve => setTimeout(resolve, 1500)
              );
            }

            console.log(
              "Finished updating all stocks."
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
